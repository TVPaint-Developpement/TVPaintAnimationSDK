<h1 align="center">How to include an image inside a button ? </h1>
<h1 align="center">&nbsp;</h1>
<blockquote> 
  <p>This section explains how to include an image inside a button. <br>
    You need to export your image with the plugin "image printer". </p>
  <p>To include the image inside a button, use : <a href="../../PIFunctions/Host/Interface/TVPutButtonImage.htm"><b>TVPutButtonImage()</b></a> 
    and put the function include with your C file GetImage().</p>
</blockquote>
