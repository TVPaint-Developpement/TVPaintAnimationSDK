name: Python Tests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Getting the name of the branch to test
        id: get_branch_name
        # Through env, never ${{ }} inside the script: a quote in a branch name would break it, or inject into it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "branch_name=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "branch_name=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout TVPaintAnimationSDK
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.get_branch_name.outputs.branch_name }}
          path: TVPaintAnimationSDK

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pytest
        run: pip install pytest

      - name: Run Python tests
        working-directory: TVPaintAnimationSDK
        run: pytest tools/tests/